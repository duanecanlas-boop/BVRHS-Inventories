<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>School Supplies Inventory</title>
<style>
:root{--b9:#2e1a0e;--b7:#4a2a16;--b5:#6b4226;--g:#c28a12;--g2:#e2b43c;--g0:#f6e7bd;--bg:#fcfaf4;--ink:#2b1d12;--mut:#7a6857;--line:#e0d6c3}
*{box-sizing:border-box}body{margin:0;font:14px/1.45 "Segoe UI",system-ui,sans-serif;color:var(--ink);background:var(--bg)}
h1,h2,h3,h4{font-family:Georgia,serif;margin:0}h2{color:var(--b7);font-size:24px}
button{font:inherit;cursor:pointer;border:1px solid var(--g);background:var(--g);color:var(--b9);padding:7px 14px;border-radius:6px;font-weight:600}
button.o{background:transparent;color:var(--b7);border-color:var(--line)}button.d{background:#a3341f;border-color:#a3341f;color:#fff}
:focus-visible{outline:2px solid var(--g2);outline-offset:1px}
label{display:block;margin:8px 0;font-weight:600;color:var(--b7)}
input,select,textarea{font:inherit;padding:7px 9px;border:1px solid var(--line);border-radius:6px;background:#fff;color:var(--ink);width:100%;margin-top:3px;font-weight:400}
.app{display:grid;grid-template-columns:230px 1fr;min-height:100vh}
.side{background:#fbf1d3;color:var(--b7);padding:18px 12px;display:flex;flex-direction:column;gap:8px;border-right:4px solid var(--g2)}
.br{display:flex;gap:10px;align-items:center;padding:4px 6px 14px}.br b{font-family:Georgia,serif;line-height:1.2}
.lgb{width:64px;height:64px;border-radius:50%;background:var(--g);color:var(--b9);display:grid;place-items:center;font:700 22px Georgia;object-fit:contain}
.br .lgb{width:44px;height:44px;font-size:15px;flex:none;background-color:#fff}
.nv{display:block;width:100%;text-align:left;background:transparent;border:0;color:var(--b7);margin:2px 0}
.nv.on{background:var(--g2);color:var(--b9)}.who{margin-top:auto;font-size:13px}.who button{margin-top:8px;width:100%;color:var(--b9);border-color:var(--g)}
main{padding:22px;min-width:0}.bar{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:14px}
.bar input{width:auto}.mut{color:var(--mut)}.er{color:#a3341f;min-height:1em}
.st{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.st div{background:#fff;border-left:4px solid var(--g);padding:9px 12px;border-radius:4px}.st b{display:block;font-size:19px;color:var(--b7)}
.tw{overflow-x:auto}table{border-collapse:collapse;width:100%;background:#fff}th,td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{background:var(--g0);color:var(--b7);font-weight:600;border-bottom:2px solid var(--g2)}.n{text-align:right}
.tag{padding:2px 8px;border-radius:10px;font-size:12px;font-weight:600}.ok{background:#e1edd6;color:#2f5520}.lo{background:#f6d9d2;color:#8a2a18}.pe{background:var(--g0);color:#7a5200}
.paper{background:#fff;border:1px solid var(--line);border-top:5px solid var(--g);padding:22px;margin-top:10px}
.paper th,.paper td{border:1px solid #888;color:#000}.paper th{background:#f0e6cf}
.hd{display:flex;flex-direction:column;align-items:center;gap:6px}.hd img{height:72px}.bn{display:block;max-width:100%;margin:0 auto 8px}.kv{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}.ap{text-align:right;font-style:italic;font-size:12px}.sg:empty{display:none}.sgt td{height:30px;text-align:center}.sgt td:first-child{text-align:left;width:120px}.ph{text-align:center;line-height:1.3}.ph b{display:block;font-size:16px}
.pt{text-align:center;margin:12px 0}.kv{margin:4px 0}.sg{display:flex;justify-content:space-around;gap:20px;margin-top:34px;text-align:center;flex-wrap:wrap}.pf{margin-top:20px;font-size:12px;text-align:center;white-space:pre-line}
.box{background:#fff;border:1px solid var(--line);border-radius:8px;padding:14px;margin:12px 0}.box summary{cursor:pointer;font-weight:700;color:var(--b7)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
.mod{position:fixed;inset:0;background:#2e1a0ea0;display:grid;place-items:center;z-index:9}.mb{background:#fff;padding:20px;border-radius:10px;width:min(460px,92vw);max-height:90vh;overflow:auto}.ma{display:flex;gap:8px;margin-top:12px}
.login{min-height:100vh;position:relative;overflow:hidden;display:grid;place-items:center;padding:24px;background:#fbf8f1}
.geo{position:absolute;inset:0;width:100%;height:100%}
.lw{position:relative;text-align:center;width:min(380px,100%)}
.lw .lgb{width:96px;height:96px;font-size:32px;margin:0 auto 10px;background-color:#fff;border:3px solid var(--g)}
.lw h1{color:var(--b7);font-size:24px}.lw .sub{color:var(--mut);margin:4px 0 16px}
.lc{background:#fffdf8;border:1px solid var(--line);border-top:5px solid var(--g);border-radius:8px;padding:22px;text-align:left;box-shadow:0 8px 24px #6b422614}
@media(max-width:760px){.app{grid-template-columns:1fr}.side{border-right:0}.g2{grid-template-columns:1fr}}
@media print{@page{size:landscape;margin:12mm}body *{visibility:hidden}.paper,.paper *{visibility:visible}.paper{position:absolute;left:0;top:0;width:100%;border:0;padding:0}}
</style></head><body><div id="r"></div>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const P=n=>Number(n||0).toLocaleString('en-PH',{minimumFractionDigits:2,maximumFractionDigits:2});
const td=()=>new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,10);
const mn=m=>new Date(m+'-01').toLocaleDateString('en-PH',{month:'long',year:'numeric',timeZone:'UTC'});
const K='school_inventory_v1',H='Republic of the Philippines\nDepartment of Education';
let D,S={view:'',user:null,month:td().slice(0,7),form:'rsmi',fi:'',ri:'',modal:null,msg:''};
function seed(){const m=td().slice(0,8)+'01',it=[['PP-001','Bond paper, A4, 70gsm','ream',230,20],['PP-002','Bond paper, long, 70gsm','ream',255,20],['WS-001','Ballpen, black','box',95,10],['WS-002','Folder, long, tan','pack',180,10],['CL-001','Alcohol, 500 ml','bottle',68,12],['IT-001','Ink, black (printer)','bottle',310,6]],f=()=>({h:H,f:''});
return{school:{name:'Bonifacio V. Romero High School',entity:'Bonifacio V. Romero High School',fund:'01',addr:'',logo:''},
users:[{u:'admin',p:'admin123',name:'Administrator',role:'admin',office:'Supply Office'},{u:'teacher',p:'teacher123',name:'Sample Requester',role:'requester',office:'Faculty'}],
items:it.map((x,i)=>({id:'i'+i,no:x[0],name:x[1],unit:x[2],cost:x[3],re:x[4]})),tx:it.map((x,i)=>({d:m,i:'i'+i,t:'R',q:x[4]*4,c:x[3],ref:'Opening balance'})),reqs:[],n:0,
sigs:{sup:{n:'',d:'Supply Officer'},prin:{n:'',d:'School Principal'},acc:{n:'',d:'Accounting Staff'}},forms:{rsmi:f(),sc:f(),slc:f(),ris:f(),sum:f(),items:f()}}}
try{D=JSON.parse(localStorage.getItem(K))}catch(e){}D=D||seed();
const save=()=>{try{localStorage.setItem(K,JSON.stringify(D))}catch(e){}};
const me=()=>D.users.find(x=>x.u==S.user);
function led(id){const it=D.items.find(i=>i.id==id);let q=0,tot=0;return D.tx.filter(t=>t.i==id).sort((a,b)=>a.d<b.d?-1:a.d>b.d?1:0).map(t=>{const c=t.t=='R'?t.c:(q?tot/q:it.cost),a=t.q*c;if(t.t=='R'){q+=t.q;tot+=a}else{q-=t.q;tot-=a}return{...t,c,a,bq:q,bt:tot,bc:q?tot/q:0}})}
const onhand=id=>{const r=led(id);return r.length?r[r.length-1]:{bq:0,bt:0,bc:0}};
const sum=(a,f)=>a.reduce((s,x)=>s+f(x),0);
function sdata(m){return D.items.map(it=>{const r=led(it.id),b=r.filter(x=>x.d<m+'-01').pop(),e=r.filter(x=>x.d<=m+'-31').pop(),im=r.filter(x=>x.d.slice(0,7)==m),rc=im.filter(x=>x.t=='R'),is=im.filter(x=>x.t=='I');return{it,bq:b?b.bq:0,bv:b?b.bt:0,rq:sum(rc,x=>x.q),rv:sum(rc,x=>x.a),iq:sum(is,x=>x.q),iv:sum(is,x=>x.a),eq:e?e.bq:0,ev:e?e.bt:0}})}
const ini=()=>D.school.name.split(/\s+/).filter(w=>/^[A-Za-z]/.test(w)).map(w=>w[0].toUpperCase()).slice(0,3).join('');
const logoEl=c=>D.school.logo?`<img src="${D.school.logo}" class="${c}" alt="Logo">`:`<div class="${c}">${esc(ini())}</div>`;
const paper=(k,t,b,...sg)=>`<div class="paper">${D.forms[k].hi?`<img class="bn" src="${D.forms[k].hi}" alt="">`:''}<div class="hd">${D.school.deped?`<img src="${D.school.deped}" alt="DepEd logo">`:''}<div class="ph">${esc(D.forms[k].h).replace(/\n/g,'<br>')}<b>${esc(D.school.entity||D.school.name)}</b>${esc(D.school.addr)}</div></div><h3 class="pt">${esc(t)}</h3>${b}<div class="sg">${sg.map(s=>{const g=typeof s[1]=='string'?D.sigs[s[1]]:s[1];return `<div>${s[0]}<br><br><b>${esc(g.n||'______________________')}</b><br>${esc(g.d)}${s[2]?`<br><small>${s[2]}</small>`:''}</div>`}).join('')}</div><div class="pf">${esc(D.forms[k].f)}</div>${D.forms[k].fi?`<img class="bn" src="${D.forms[k].fi}" alt="">`:''}</div>`;
const kvl=(...a)=>`<div class="kv">${a.map(x=>`<span>${x}</span>`).join('')}</div>`;
const head=()=>kvl('Entity Name: <b>'+esc(D.school.entity||D.school.name)+'</b>','Fund Cluster: <b>'+esc(D.school.fund)+'</b>');
const itemblk=it=>`<table><tr><td>Item: <b>${esc(it.name)}</b><td>Stock No.: <b>${esc(it.no)}</b></tr><tr><td>Description: <b>${esc(it.name)}</b><td>Re-order Point: <b>${it.re}</b></tr><tr><td colspan="2">Unit of Measurement: <b>${esc(it.unit)}</b></tr></table>`;
const stats=()=>{let v=0,low=0;D.items.forEach(i=>{const o=onhand(i.id);v+=o.bt;if(o.bq<=i.re)low++});return `<div class="st"><div><b>${D.items.length}</b>supply items</div><div><b>₱${P(v)}</b>inventory value</div><div><b>${low}</b>at or below reorder point</div><div><b>${D.reqs.filter(r=>r.s=='Pending').length}</b>pending requests</div></div>`};
const lines=r=>r.lines.map(l=>{const i=D.items.find(x=>x.id==l.i);return i?`${l.q} ${esc(i.unit)} ${esc(i.name)}`:''}).join('<br>');
const hf=(k,n)=>`<details class="box" ${n?'':'open'}><summary>Header and footer: ${n||'this form'}</summary><div class="g2"><label>Header (one line per row)<textarea rows="3" data-k="forms.${k}.h">${esc(D.forms[k].h)}</textarea></label><label>Footer<textarea rows="3" data-k="forms.${k}.f">${esc(D.forms[k].f)}</textarea></label></div><div class="g2"><label>Header image (banner)<input type="file" accept="image/*" onchange="upl(this,'forms.${k}.hi',900)"></label><label>Footer image (banner)<input type="file" accept="image/*" onchange="upl(this,'forms.${k}.fi',900)"></label></div>${D.forms[k].hi?`<button class="o" data-a="rmi" data-p="forms.${k}.hi">Remove header image</button> `:''}${D.forms[k].fi?`<button class="o" data-a="rmi" data-p="forms.${k}.fi">Remove footer image</button> `:''}<button class="o" data-a="go" data-v="${S.view}">Apply changes</button></details>`;
const P_={};
P_.rsmi=m=>{const rows=D.items.flatMap(i=>led(i.id).map(r=>({...r,it:i}))).filter(r=>r.t=='I'&&r.d.slice(0,7)==m).sort((a,b)=>a.d<b.d?-1:1),g={};rows.forEach(r=>{g[r.i]=g[r.i]||{it:r.it,q:0,a:0};g[r.i].q+=r.q;g[r.i].a+=r.a});
return paper('rsmi','REPORT OF SUPPLIES AND MATERIALS ISSUED','<div class="ap">Appendix 64</div>'+head()+kvl('Serial No.: ________','Date: '+td())+`<div class="kv" style="justify-content:center">For the month of ${mn(m)}</div><div class="tw"><table><tr><th colspan="8">To be filled up by the Supply and/or Property Division/Unit</tr><tr><th>RIS No.<th>Responsibility Center Code<th>Stock No.<th>Item<th>Unit<th>Quantity Issued<th>Unit Cost<th>Amount</tr>${rows.map(r=>`<tr><td>${esc(r.ref)}<td>${esc(r.off||'')}<td>${esc(r.it.no)}<td>${esc(r.it.name)}<td>${esc(r.it.unit)}<td class="n">${r.q}<td class="n">${P(r.c)}<td class="n">${P(r.a)}</tr>`).join('')||'<tr><td colspan="8">No issuances this month.</tr>'}<tr><th colspan="7">Total<th class="n">${P(sum(rows,r=>r.a))}</tr></table></div><div class="tw"><table><tr><th colspan="5">To be filled up by the Accounting Division/Unit</tr><tr><th colspan="2">Recapitulation<th colspan="3">Recapitulation</tr><tr><th>Stock No.<th>Quantity<th>Unit Cost<th>Total Cost<th>UACS Object Code</tr>${Object.values(g).map(x=>`<tr><td>${esc(x.it.no)}<td class="n">${x.q}<td class="n">${P(x.a/x.q)}<td class="n">${P(x.a)}<td></tr>`).join('')}</table></div><p>I hereby certify to the correctness of the above information.</p>`,['Certified correct by:','sup','Signature over Printed Name of Supply and/or Property Custodian'],['Posted by:','acc','Signature over Printed Name of Designated Accounting Staff'])};
P_.sc=id=>{const it=D.items.find(i=>i.id==id);if(!it)return'';return paper('sc','STOCK CARD','<div class="ap">Appendix 58</div>'+head()+itemblk(it)+`<div class="tw"><table><tr><th rowspan="2">Date<th rowspan="2">Reference<th>Receipt<th colspan="2">Issue<th>Balance<th rowspan="2">No. of Days to Consume</tr><tr><th>Qty.<th>Qty.<th>Office<th>Qty.</tr>${led(id).map(r=>`<tr><td>${r.d}<td>${esc(r.ref)}<td class="n">${r.t=='R'?r.q:''}<td class="n">${r.t=='I'?r.q:''}<td>${esc(r.off||'')}<td class="n">${r.bq}<td></tr>`).join('')}</table></div>`,['Prepared by:','sup','Signature over Printed Name of Supply and/or Property Custodian'],['Noted by:','prin','Signature over Printed Name of Head of Office'])};
P_.slc=id=>{const it=D.items.find(i=>i.id==id);if(!it)return'';return paper('slc','STOCK LEDGER CARD','<div class="ap">Appendix 57</div>'+head()+itemblk(it)+`<div class="tw"><table><tr><th rowspan="2">Date<th rowspan="2">Reference<th colspan="3">Receipt<th colspan="3">Issue<th colspan="3">Balance</tr><tr>${'<th>Qty.<th>Unit Cost<th>Total Cost'.repeat(3)}</tr>${led(id).map(r=>{const R=r.t=='R',c=`<td class="n">${r.q}<td class="n">${P(r.c)}<td class="n">${P(r.a)}`;return `<tr><td>${r.d}<td>${esc(r.ref)}${R?c+'<td><td><td>':'<td><td><td>'+c}<td class="n">${r.bq}<td class="n">${P(r.bc)}<td class="n">${P(r.bt)}</tr>`}).join('')}</table></div>`,['Prepared by:','sup','Signature over Printed Name of Supply and/or Property Custodian'],['Noted by:','prin','Signature over Printed Name of Head of Office'])};
P_.ris=id=>{const r=D.reqs.find(x=>x.id==id);if(!r)return'<p class="mut">Select a request to show its Requisition and Issue Slip.</p>';const pn=D.sigs.prin,sp=D.sigs.sup;return paper('ris','REQUISITION AND ISSUE SLIP','<div class="ap">Appendix 63</div>'+head()+kvl('Division: ________','Responsibility Center Code: ________')+kvl('Office: <b>'+esc(r.office)+'</b>','RIS No.: <b>'+r.no+'</b>','Date: <b>'+r.d+'</b>')+`<div class="tw"><table><tr><th colspan="4">Requisition<th colspan="2">Stock Available?<th colspan="2">Issue</tr><tr><th>Stock No.<th>Unit<th>Description<th>Quantity<th>Yes<th>No<th>Quantity<th>Remarks</tr>${r.lines.map(l=>{const i=D.items.find(x=>x.id==l.i)||{},ok=r.s=='Issued'||onhand(l.i).bq>=l.q;return `<tr><td>${esc(i.no)}<td>${esc(i.unit)}<td>${esc(i.name)}<td class="n">${l.q}<td class="n">${ok?'✓':''}<td class="n">${ok?'':'✓'}<td class="n">${r.s=='Issued'?l.q:''}<td></tr>`}).join('')}<tr><td colspan="8">Purpose: <b>${esc(r.purpose)}</b></tr></table></div><div class="tw"><table class="sgt"><tr><th><th>Requested by:<th>Approved by:<th>Issued by:<th>Received by:</tr><tr><td>Signature:<td><td><td><td></tr><tr><td>Printed Name:<td>${esc(r.name)}<td>${esc(pn.n)}<td>${esc(sp.n)}<td>${esc(r.name)}</tr><tr><td>Designation:<td>${esc(r.office)}<td>${esc(pn.d)}<td>${esc(sp.d)}<td>${esc(r.office)}</tr><tr><td>Date:<td>${r.d}<td><td>${r.dt||''}<td></tr></table></div>`)};
const V={};
V.summary=()=>{const m=S.month,rows=sdata(m),T=k=>sum(rows,x=>x[k]);return `<div class="bar"><h2>Monthly summary</h2><span><input type="month" value="${m}" onchange="S.month=this.value;render()"> <button data-a="print">Export PDF</button> <button class="o" data-a="xls">Export Excel</button></span></div>${stats()}${paper('sum','Summary of Supplies Inventory — '+mn(m),`<div class="tw"><table><tr><th rowspan="2">Stock No.<th rowspan="2">Item<th rowspan="2">Unit<th colspan="2">Beginning<th colspan="2">Receipts<th colspan="2">Issued<th colspan="2">Ending</tr><tr>${'<th>Qty<th>Amount'.repeat(4)}</tr>${rows.map(x=>`<tr><td>${esc(x.it.no)}<td>${esc(x.it.name)}<td>${esc(x.it.unit)}<td class="n">${x.bq}<td class="n">${P(x.bv)}<td class="n">${x.rq}<td class="n">${P(x.rv)}<td class="n">${x.iq}<td class="n">${P(x.iv)}<td class="n">${x.eq}<td class="n">${P(x.ev)}</tr>`).join('')}<tr><th colspan="3">Total<th><th class="n">${P(T('bv'))}<th><th class="n">${P(T('rv'))}<th><th class="n">${P(T('iv'))}<th><th class="n">${P(T('ev'))}</tr></table></div>`,['Prepared by:','sup'],['Approved by:','prin'])}`};
V.items=()=>`<div class="bar"><h2>Supplies</h2><span><button data-a="addi">Add item</button> <button class="o" data-a="print">Print</button> <button class="o" data-a="xls">Export Excel</button></span></div>${stats()}${paper('items','Stock on Hand as of '+td(),`<div class="tw"><table><tr><th>Stock No.<th>Description<th>Unit<th class="n">Unit cost<th class="n">On hand<th class="n">Total cost<th class="n">Reorder pt.<th>Status<th></tr>${D.items.map(i=>{const o=onhand(i.id);return `<tr><td>${esc(i.no)}<td>${esc(i.name)}<td>${esc(i.unit)}<td class="n">${P(o.bc||i.cost)}<td class="n">${o.bq}<td class="n">${P(o.bt)}<td class="n">${i.re}<td>${o.bq<=i.re?'<span class="tag lo">Low</span>':'<span class="tag ok">OK</span>'}<td><button class="o" data-a="rcv" data-id="${i.id}">Receive</button> <button class="o" data-a="edi" data-id="${i.id}">Edit</button></tr>`}).join('')}</table></div>`,['Prepared by:','sup'],['Noted by:','prin'])}`;
V.forms=()=>{const f=S.form,fi=S.fi||(D.items[0]||{}).id;let pick,body;
if(f=='rsmi'){pick=`<input type="month" value="${S.month}" onchange="S.month=this.value;render()">`;body=P_.rsmi(S.month)}
else if(f=='ris'){pick=`<select onchange="S.ri=this.value;render()"><option value="">Select request</option>${D.reqs.map(r=>`<option value="${r.id}" ${S.ri==r.id?'selected':''}>${r.no} — ${esc(r.name)}</option>`).join('')}</select>`;body=P_.ris(S.ri)}
else{pick=`<select onchange="S.fi=this.value;render()">${D.items.map(i=>`<option value="${i.id}" ${fi==i.id?'selected':''}>${esc(i.no)} ${esc(i.name)}</option>`).join('')}</select>`;body=P_[f](fi)}
return `<div class="bar"><h2>COA forms</h2><span>${[['rsmi','RSMI'],['sc','Stock Card'],['slc','Stock Ledger Card'],['ris','RIS']].map(x=>`<button class="${f==x[0]?'':'o'}" data-a="frm" data-f="${x[0]}">${x[1]}</button>`).join(' ')}</span></div><div class="bar"><span>${pick}</span><span><button data-a="print">Print / Save as PDF</button> <button class="o" data-a="xls">Export Excel</button></span></div>${hf(f)}${body}`};
V.reqs=()=>`<div class="bar"><h2>Requests and history</h2></div><p class="er">${esc(S.msg)}</p><div class="tw"><table><tr><th>RIS No.<th>Date<th>Requested by<th>Items<th>Purpose<th>Status<th></tr>${[...D.reqs].reverse().map(r=>`<tr><td>${r.no}<td>${r.d}<td>${esc(r.name)}<br><small>${esc(r.office)}</small><td>${lines(r)}<td>${esc(r.purpose)}<td><span class="tag ${r.s=='Issued'?'ok':r.s=='Pending'?'pe':'lo'}">${r.s}</span><td>${r.s=='Pending'?`<button data-a="iss" data-id="${r.id}">Issue</button> <button class="o" data-a="dec" data-id="${r.id}">Decline</button> `:''}<button class="o" data-a="vris" data-id="${r.id}">RIS</button></tr>`).join('')||'<tr><td colspan="7">No requests yet.</tr>'}</table></div>`;
V.new=()=>`<div class="bar"><h2>Request supplies</h2></div><p class="mut">Enter the quantity you need. The supply office will review your request.</p><div class="tw"><table><tr><th>Stock No.<th>Item<th>Unit<th class="n">Available<th>Qty needed</tr>${D.items.map(i=>{const o=onhand(i.id).bq;return `<tr><td>${esc(i.no)}<td>${esc(i.name)}<td>${esc(i.unit)}<td class="n">${o}<td><input type="number" min="0" max="${o}" id="q_${i.id}" style="width:90px" ${o?'':'disabled'}></tr>`}).join('')}</table></div><label>Purpose<textarea id="pu" rows="2"></textarea></label><button data-a="sub">Submit request</button><p class="${S.msg.startsWith('Request')?'':'er'}">${esc(S.msg)}</p>`;
V.mine=()=>`<div class="bar"><h2>My requests</h2></div><div class="tw"><table><tr><th>RIS No.<th>Date<th>Items<th>Purpose<th>Status<th></tr>${D.reqs.filter(r=>r.u==S.user).reverse().map(r=>`<tr><td>${r.no}<td>${r.d}<td>${lines(r)}<td>${esc(r.purpose)}<td><span class="tag ${r.s=='Issued'?'ok':r.s=='Pending'?'pe':'lo'}">${r.s}</span><td><button class="o" data-a="vris" data-id="${r.id}">View RIS</button></tr>`).join('')||'<tr><td colspan="6">You have no requests yet.</tr>'}</table></div>`;
V.ris=()=>`<div class="bar"><button class="o" data-a="go" data-v="mine">Back</button><button data-a="print">Print / Save as PDF</button></div>${P_.ris(S.ri)}`;
V.set=()=>{const s='school.';return `<div class="bar"><h2>Settings</h2></div><div class="box"><h3>School</h3><div class="g2"><label>School name<input data-k="school.name" value="${esc(D.school.name)}"></label><label>Entity name on forms<input data-k="school.entity" value="${esc(D.school.entity)}"></label><label>Fund cluster<input data-k="school.fund" value="${esc(D.school.fund)}"></label><label>Address (optional line under the name)<input data-k="school.addr" value="${esc(D.school.addr)}"></label></div><label>School logo (login page and sidebar)<input type="file" accept="image/*" onchange="upl(this,'school.logo',240)"></label><div style="display:flex;gap:12px;align-items:center">${logoEl('lgb')}${D.school.logo?'<button class="o" data-a="rml">Remove logo</button>':''}</div><label>DepEd logo (shown at the top of every form)<input type="file" accept="image/*" onchange="upl(this,'school.deped',300)"></label><div style="display:flex;gap:12px;align-items:center">${D.school.deped?`<img src="${D.school.deped}" style="height:64px" alt=""><button class="o" data-a="rmi" data-p="school.deped">Remove DepEd logo</button>`:'<span class="mut">No DepEd logo yet. Upload the official logo.</span>'}</div></div>
<div class="box"><h3>Signatories</h3><p class="mut">Enter once. They appear automatically on every form and can be changed anytime.</p>${[['sup','Prepared by / Issued by'],['prin','Approved by'],['acc','Accounting']].map(x=>`<div class="g2"><label>${x[1]}: name<input data-k="sigs.${x[0]}.n" value="${esc(D.sigs[x[0]].n)}"></label><label>Designation<input data-k="sigs.${x[0]}.d" value="${esc(D.sigs[x[0]].d)}"></label></div>`).join('')}</div>
<div class="box"><div class="bar"><h3>Users</h3><button data-a="addu">Add user</button></div><div class="tw"><table><tr><th>Username<th>Name<th>Office<th>Role<th></tr>${D.users.map(u=>`<tr><td>${esc(u.u)}<td>${esc(u.name)}<td>${esc(u.office)}<td>${u.role}<td><button class="o" data-a="edu" data-id="${u.u}">Edit</button> ${u.u==S.user?'':`<button class="o" data-a="delu" data-id="${u.u}">Delete</button>`}</tr>`).join('')}</table></div></div>
${[['rsmi','RSMI'],['sc','Stock Card'],['slc','Stock Ledger Card'],['ris','RIS'],['sum','Monthly summary'],['items','Supplies list']].map(x=>hf(x[0],x[1])).join('')}`};
function modal(){const m=S.modal,f=(l,id,v='',t='text')=>`<label>${l}<input id="${id}" type="${t}" value="${esc(v)}"></label>`;let h;
if(m.t=='item'){const i=D.items.find(x=>x.id==m.id)||{};h=`<h3>${m.id?'Edit item':'Add item'}</h3>${f('Stock No.','m1',i.no)}${f('Description','m2',i.name)}${f('Unit of measure','m3',i.unit)}${f('Unit cost (₱)','m4',i.cost,'number')}${f('Reorder point','m5',i.re,'number')}${m.id?'':f('Opening quantity','m6',0,'number')}<div class="ma"><button data-a="svi">Save</button>${m.id?'<button class="d" data-a="deli">Delete</button>':''}<button class="o" data-a="cm">Cancel</button></div>`}
else if(m.t=='rcv'){const i=D.items.find(x=>x.id==m.id);h=`<h3>Receive stock: ${esc(i.name)}</h3>${f('Date','m1',td(),'date')}${f('Quantity received','m2','','number')}${f('Unit cost (₱)','m3',onhand(i.id).bc||i.cost,'number')}${f('Reference (e.g. IAR / delivery no.)','m4')}<div class="ma"><button data-a="svr">Save</button><button class="o" data-a="cm">Cancel</button></div>`}
else{const u=D.users.find(x=>x.u==m.id)||{role:'requester'};h=`<h3>${m.id?'Edit user':'Add user'}</h3>${f('Username','m1',u.u)}${f('Password','m2',u.p)}${f('Full name','m3',u.name)}${f('Office / department','m4',u.office)}<label>Role<select id="m5"><option value="requester" ${u.role=='requester'?'selected':''}>Requester</option><option value="admin" ${u.role=='admin'?'selected':''}>Administrator</option></select></label><div class="ma"><button data-a="svu">Save</button><button class="o" data-a="cm">Cancel</button></div>`}
return `<div class="mod"><div class="mb">${h}<p class="er">${esc(S.msg)}</p></div></div>`}
function render(){const r=$('#r');if(!S.user){r.innerHTML=`<div class="login">${GEO}<div class="lw">${logoEl('lgb')}<h1>${esc(D.school.name)}</h1><p class="sub">Supplies Inventory System</p><div class="lc"><label>Username<input id="lu" autocomplete="username"></label><label>Password<input id="lp" type="password" autocomplete="current-password" onkeydown="if(event.key=='Enter')act.login()"></label><p class="er">${esc(S.msg)}</p><button data-a="login" style="width:100%">Log in</button></div></div></div>`;return}
const u=me(),nav=u.role=='admin'?[['summary','Monthly summary'],['items','Supplies'],['forms','COA forms'],['reqs','Requests and history'],['set','Settings']]:[['new','Request supplies'],['mine','My requests']];
r.innerHTML=`<div class="app"><aside class="side"><div class="br">${logoEl('lgb')}<b>${esc(D.school.name)}</b></div>${nav.map(n=>`<button class="nv ${S.view==n[0]?'on':''}" data-a="go" data-v="${n[0]}">${n[1]}</button>`).join('')}<div class="who">${esc(u.name)}<br><small>${u.role=='admin'?'Administrator':'Requester'}</small><button data-a="out">Log out</button></div></aside><main>${V[S.view]()}</main></div>${S.modal?modal():''}`}
function setP(k,val){const p=k.split('.');let o=D;p.slice(0,-1).forEach(x=>o=o[x]);o[p.pop()]=val}
function upl(el,key,max){const f=el.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const s=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*s;c.height=im.height*s;c.getContext('2d').drawImage(im,0,0,c.width,c.height);setP(key,c.toDataURL('image/png'));save();render()};im.src=r.result};r.readAsDataURL(f)}
const GEO='<svg class="geo" viewBox="0 0 800 600" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><g fill="none" stroke="#d9b866" stroke-width="1.5" opacity=".7"><circle cx="90" cy="90" r="150"/><circle cx="90" cy="90" r="100"/><circle cx="730" cy="520" r="170"/><circle cx="730" cy="520" r="110"/><path d="M0 330L220 600M0 400L160 600M640 0L800 190M700 0L800 110"/></g><g opacity=".55"><polygon points="560,40 700,40 630,160" fill="#f0dfae"/><polygon points="60,430 200,430 130,550" fill="#e8d3a0"/><polygon points="330,520 400,440 470,520 400,600" fill="#ecd9b0"/><rect x="620" y="270" width="110" height="110" transform="rotate(30 675 325)" fill="#e9cfa0"/><rect x="250" y="40" width="70" height="70" transform="rotate(45 285 75)" fill="#f3e6c4"/><polygon points="760,330 800,330 800,400" fill="#d9b866"/></g><g fill="#c28a12" opacity=".35"><circle cx="520" cy="140" r="6"/><circle cx="170" cy="300" r="5"/><circle cx="440" cy="560" r="6"/><circle cx="90" cy="540" r="4"/></g></svg>';
const v=id=>$('#'+id).value,num=id=>Number(v(id))||0;
const act={
login(){const u=D.users.find(x=>x.u==v('lu').trim()&&x.p==v('lp'));if(!u){S.msg='Wrong username or password.';return render()}S.user=u.u;S.msg='';S.view=u.role=='admin'?'summary':'new';render()},
out(){S.user=null;S.msg='';render()},go(d){S.view=d.v;S.msg='';render()},frm(d){S.form=d.f;render()},print(){window.print()},
xls(){const h=[...document.querySelectorAll('.paper table')].map(t=>t.outerHTML).join('<br>'),a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['<html><head><meta charset="utf-8"></head><body><h3>'+esc(D.school.name)+'</h3>'+h+'</body></html>'],{type:'application/vnd.ms-excel'}));a.download=S.view+'-'+S.month+'.xls';a.click()},
cm(){S.modal=null;S.msg='';render()},addi(){S.modal={t:'item'};render()},edi(d){S.modal={t:'item',id:d.id};render()},rcv(d){S.modal={t:'rcv',id:d.id};render()},
svi(){const o={no:v('m1').trim(),name:v('m2').trim(),unit:v('m3').trim(),cost:num('m4'),re:num('m5')};if(!o.no||!o.name){S.msg='Enter the stock number and description.';return render()}
if(S.modal.id)Object.assign(D.items.find(x=>x.id==S.modal.id),o);else{const id='i'+Date.now();D.items.push({id,...o});if(num('m6')>0)D.tx.push({d:td(),i:id,t:'R',q:num('m6'),c:o.cost,ref:'Opening balance'})}save();act.cm()},
deli(){if(!confirm('Delete this item and its stock history?'))return;D.items=D.items.filter(x=>x.id!=S.modal.id);D.tx=D.tx.filter(t=>t.i!=S.modal.id);save();act.cm()},
svr(){if(num('m2')<=0){S.msg='Enter the quantity received.';return render()}D.tx.push({d:v('m1')||td(),i:S.modal.id,t:'R',q:num('m2'),c:num('m3'),ref:v('m4')||'Delivery'});save();act.cm()},
addu(){S.modal={t:'user'};render()},edu(d){S.modal={t:'user',id:d.id};render()},
svu(){const o={u:v('m1').trim(),p:v('m2'),name:v('m3').trim(),office:v('m4').trim(),role:v('m5')};if(!o.u||!o.p||!o.name){S.msg='Enter username, password and full name.';return render()}
if(D.users.some(x=>x.u==o.u&&x.u!=S.modal.id)){S.msg='That username is already taken.';return render()}
if(S.modal.id){if(S.user==S.modal.id)S.user=o.u;Object.assign(D.users.find(x=>x.u==S.modal.id),o)}else D.users.push(o);save();act.cm()},
delu(d){if(confirm('Delete user '+d.id+'?')){D.users=D.users.filter(x=>x.u!=d.id);save();render()}},
rml(){D.school.logo='';save();render()},rmi(d){setP(d.p,'');save();render()},
vris(d){S.ri=d.id;if(me().role=='admin'){S.view='forms';S.form='ris'}else S.view='ris';render()},
iss(d){const r=D.reqs.find(x=>x.id==d.id),bad=r.lines.find(l=>onhand(l.i).bq<l.q);if(bad){S.msg='Not enough stock for '+(D.items.find(i=>i.id==bad.i)||{}).name+'.';return render()}
r.lines.forEach(l=>D.tx.push({d:td(),i:l.i,t:'I',q:l.q,c:0,ref:r.no,off:r.office}));r.s='Issued';r.dt=td();save();S.msg='';render()},
dec(d){D.reqs.find(x=>x.id==d.id).s='Declined';save();render()},
sub(){const ls=D.items.map(i=>({i:i.id,q:Number(($('#q_'+i.id)||{}).value)||0})).filter(l=>l.q>0);if(!ls.length){S.msg='Enter a quantity for at least one item.';return render()}
if(ls.some(l=>l.q>onhand(l.i).bq)){S.msg='A quantity is higher than the available stock.';return render()}
const u=me(),no='RIS-'+td().slice(0,7)+'-'+String(++D.n).padStart(3,'0');D.reqs.push({id:'r'+Date.now(),no,d:td(),u:u.u,name:u.name,office:u.office,purpose:v('pu').trim(),lines:ls,s:'Pending'});save();S.msg='Request '+no+' submitted.';render()}};
document.addEventListener('click',e=>{const a=e.target.closest('[data-a]');if(a&&act[a.dataset.a])act[a.dataset.a](a.dataset)});
document.addEventListener('change',e=>{const k=e.target.dataset.k;if(k){setP(k,e.target.value);save()}});
render();
</script></body></html>
